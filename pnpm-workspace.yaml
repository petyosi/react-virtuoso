packages:
  - 'packages/*'
  - 'apps/*'
  - 'examples'

strictPeerDependencies: false

peerDependencyRules:
  allowedVersions:
    'react-inspector>react': '19'

# sharp is excluded: its platform binaries arrive as optionalDependencies
# and the install-time check script is unreliable
allowBuilds:
  '@swc/core': true
  esbuild: true
  lefthook: true
  msw: true
  sharp: false

minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - '@virtuoso.dev/message-list@1.18.0'
  # the pnpm version is pinned by the packageManager field and locked
  # through the lockfile, release age gating adds nothing here
  - '@pnpm/*'
  - oxlint
  - oxfmt
  - oxlint-tsgolint
  - '@oxlint/*'
  - '@oxfmt/*'
  - '@oxlint-tsgolint/*'

catalog:
  typescript: ^5.9.3

  vite: ^8.3.6
  react: ^19.3.1
  react-dom: ^19.3.1
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@types/node': ^26.6.6
  vitest: ^5.1.0
  '@vitejs/plugin-react': ^6.2.1
  vite-plugin-dts: ^5.1.2
  playwright: ^1.64.1
  '@vitest/browser': ^5.1.0
  '@vitest/browser-playwright': ^5.1.0
  oxlint: ^1.93.0
  oxfmt: ^0.78.0
  oxlint-tsgolint: ^7.0.2006
  tiny-invariant: ^1.3.3
  '@testing-library/react': ^16.3.3
  '@testing-library/jest-dom': ^7.0.1
  '@microsoft/api-extractor': ^7.60.1
  jsdom: ^31.0.0
  knip: ^6.44.1
  '@ladle/react': ^5.1.1
