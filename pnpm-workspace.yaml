packages:
  - 'packages/*'
  - 'apps/*'
  - 'examples'

strictPeerDependencies: false

peerDependencyRules:
  allowedVersions:
    'react-inspector>react': '19'

# sharp is excluded: its platform binaries arrive as optionalDependencies
# and the install-time check script is unreliable
allowBuilds:
  '@swc/core': true
  esbuild: true
  lefthook: true
  msw: true
  sharp: false

minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - '@virtuoso.dev/message-list@1.18.0'
  # the pnpm version is pinned by the packageManager field and locked
  # through the lockfile, release age gating adds nothing here
  - '@pnpm/*'
  - oxlint
  - oxfmt
  - oxlint-tsgolint
  - '@oxlint/*'
  - '@oxfmt/*'
  - '@oxlint-tsgolint/*'

catalog:
  typescript: ^5.9.3

  vite: ^7.3.1
  react: ^19.2.3
  react-dom: ^19.2.3
  '@types/react': ^19.2.7
  '@types/react-dom': ^19.2.3
  '@types/node': ^22.19.1
  vitest: ^4.1.5
  '@vitejs/plugin-react': ^4.7.0
  vite-plugin-dts: ^4.5.4
  playwright: ^1.60.0
  '@vitest/browser': ^4.1.5
  '@vitest/browser-playwright': ^4.1.5
  oxlint: ^1.60.0
  oxfmt: ^0.45.0
  oxlint-tsgolint: ^0.21.1
  tiny-invariant: ^1.3.3
  '@testing-library/react': ^16.3.2
  '@testing-library/jest-dom': ^6.9.1
  '@microsoft/api-extractor': ^7.57.7
  jsdom: ^28.1.0
  knip: ^5.86.0
  '@ladle/react': ^5.1.1
